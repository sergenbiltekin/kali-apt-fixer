name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats gawk mawk

      - name: ShellCheck
        run: shellcheck kali-apt-fixer.sh

      - name: Bash syntax check
        run: bash -n kali-apt-fixer.sh

      - name: Bats
        run: bats tests/
